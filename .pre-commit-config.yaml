repos:
  # GDScript Toolkit
  - repo: https://github.com/Scony/godot-gdscript-toolkit
    rev: 4.2.2
    hooks:
      - id: gdlint
        name: gdlint
        description: "gdlint - linter for GDScript"
        entry: gdlint
        exclude: "^addons/|^examples_dd3d/"
        additional_dependencies: [setuptools]
        language: python
        language_version: python3
        require_serial: true
        types: [gdscript]
      - id: gdformat
        name: gdformat
        description: "gdformat - formatter for GDScript"
        exclude: "^addons/|^examples_dd3d/"
        entry: gdformat
        additional_dependencies: [setuptools]
        language: python
        language_version: python3
        require_serial: true
        types: [gdscript]